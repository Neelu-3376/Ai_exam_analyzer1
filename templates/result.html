<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Result | Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050b1a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px); }
        /* Style for tables generated by AI */
        table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.875rem; }
        th, td { border: 1px solid rgba(255,255,255,0.1); padding: 0.75rem; text-align: left; }
        th { background: rgba(255,255,255,0.05); color: #60a5fa; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto space-y-6">
        
        <div class="glass p-6 rounded-2xl border-b-2 border-blue-500 shadow-xl">
            <h3 class="text-xs font-bold text-blue-400 uppercase tracking-widest mb-2">Subject Query</h3>
            <p class="text-xl font-bold text-white leading-snug">{{ question }}</p>
        </div>

        <div class="glass p-8 rounded-3xl shadow-2xl relative overflow-hidden">
            <div class="absolute -top-20 -right-20 w-40 h-40 bg-blue-600/20 blur-[80px]"></div>
            
            <h3 class="text-xs font-bold text-cyan-400 uppercase tracking-widest mb-6 flex items-center">
                <span class="mr-2 italic font-serif">AI</span> Comprehensive Answer
            </h3>

            <div class="prose prose-invert max-w-none text-gray-300 leading-relaxed space-y-4">
                {{ answer | safe }}
            </div>

            <div class="mt-10 pt-6 border-t border-white/5 flex flex-wrap gap-4">
                <button onclick="window.print()" class="bg-white/10 hover:bg-white/20 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition">
                    🖨️ Print Answer
                </button>
                <button onclick="history.back()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition">
                    ← Back to Questions
                </button>
            </div>
        </div>

        <footer class="text-center text-gray-600 text-[10px] uppercase tracking-widest">
            Generated by AI-Exam Analyzer Engine
        </footer>
    </div>

</body>
</html>
